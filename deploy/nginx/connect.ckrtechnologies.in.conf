server {
    listen 80;
    server_name connect.ckrtechnologies.in;

    client_max_body_size 50M;

    # 1. Admin Web Portal (React + Vite Desktop App)
    location /admin/ {
        alias /var/www/ckrcrm/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 2. BDM Mobile Web / PWA (React + Vite Mobile App)
    location /bdm/ {
        alias /var/www/ckrcrm/bdm/dist/;
        try_files $uri $uri/ /bdm/index.html;
    }

    # 3. Self-Hosted VPS CDN (Uploaded Files, BRDs, Attachments)
    location /cdn/ {
        alias /var/www/ckrcrm/cdn/;
        expires 30d;
        sendfile on;
    }

    # 4. Express REST API Backend
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # 5. Default root redirect
    location = / {
        return 302 /admin/;
    }
}
